/* ===== Aurora / portfolio-style visual refresh ===== */
:root{
 --bg:#070d1b;--panel:rgba(16,29,52,.76);--panel2:rgba(22,40,69,.82);

button{

}

@media(max-width:720px){
 .side{position:relative;height:auto;backdrop-filter:blur(18px);border-right:0;border-bottom:1px solid var(--line)}
 .main{padding-top:22px}.cards{gap:10px}.card{min-height:105px}
 .panel{padding:16px;border-radius:14px}.top h1{font-size:25px}
}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}


/* ===== Site-wide motion system ===== */
:root{--motion-ease:cubic-bezier(.2,.75,.25,1)}
body{background-size:180% 180%;animation:ambientShift 30s ease-in-out infinite alternate}
.layout{animation:siteEnter .75s var(--motion-ease) both}
.main{animation:mainEnter .65s var(--motion-ease) both}
.brand .logo{animation:logoFloat 5s ease-in-out infinite}
.nav button{will-change:transform}
.nav button.active{animation:navActivate .35s var(--motion-ease) both}
.top{animation:headerEnter .7s var(--motion-ease) both}
.top .eyebrow{animation:eyebrowGlow 5s ease-in-out infinite}
#content{animation:contentEnter .5s var(--motion-ease) both}
#content .cards>.card{animation:cardEnter .65s var(--motion-ease) both}
#content .cards>.card:nth-child(2){animation-delay:.06s}
#content .cards>.card:nth-child(3){animation-delay:.12s}
#content .cards>.card:nth-child(4){animation-delay:.18s}
#content .cards>.card:nth-child(5){animation-delay:.24s}
#content .cards>.card:nth-child(6){animation-delay:.30s}
#content>.panel,#content .grid2>.panel{animation:panelEnter .7s var(--motion-ease) both}
#content>.panel:nth-of-type(2){animation-delay:.1s}
#content>.panel:nth-of-type(3){animation-delay:.18s}
.card:after,.panel:after{content:"";position:absolute;inset:-120% -60%;pointer-events:none;background:linear-gradient(110deg,transparent 43%,rgba(255,255,255,.075) 50%,transparent 57%);transform:translateX(-55%) rotate(8deg);opacity:0}
.card:hover:after,.panel:hover:after{opacity:1;animation:surfaceShine 1.15s ease}
button:not(:disabled){position:relative;overflow:hidden}
button:not(:disabled):active{transform:scale(.97)}
button.primary{background-size:180% 180%;animation:buttonGradient 8s ease infinite}
.chart .bar{transform-origin:bottom;animation:barRise 1.1s var(--motion-ease) both,barBreath 5s ease-in-out 1.2s infinite alternate}
.chart .bar:nth-child(3n){animation-delay:.08s,1.28s}
.chart .bar:nth-child(3n + 1){animation-delay:.16s,1.36s}
.pill{animation:pillAppear .45s var(--motion-ease) both}
.notice:not(.hidden){animation:noticeEnter .35s var(--motion-ease) both}
.upload{position:relative;overflow:hidden}
.upload:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(117,167,255,.09),transparent);transform:translateX(-120%);animation:uploadSweep 6s ease-in-out infinite}
.chatmsg{animation:messageEnter .35s var(--motion-ease) both}
.authbox{animation:authEnter .8s var(--motion-ease) both}
.auth .logo{animation:logoFloat 4s ease-in-out infinite}
.foot{animation:fadeIn 1.2s ease both}
@keyframes siteEnter{from{opacity:0}to{opacity:1}}
@keyframes mainEnter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes headerEnter{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
@keyframes contentEnter{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardEnter{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes panelEnter{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-2deg)}}
@keyframes navActivate{from{opacity:.6;transform:translateX(-5px)}to{opacity:1;transform:translateX(0)}}
@keyframes eyebrowGlow{0%,100%{text-shadow:0 0 0 rgba(117,167,255,0)}50%{text-shadow:0 0 14px rgba(117,167,255,.38)}}
@keyframes surfaceShine{0%{transform:translateX(-55%) rotate(8deg)}100%{transform:translateX(55%) rotate(8deg)}}
@keyframes buttonGradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes barBreath{from{filter:brightness(.96)}to{filter:brightness(1.16)}}
@keyframes pillAppear{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes noticeEnter{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:translateY(0)}}
@keyframes uploadSweep{0%,65%,100%{transform:translateX(-120%)}82%{transform:translateX(120%)}}
@keyframes messageEnter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes authEnter{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media(max-width:720px){.layout,.main{animation-duration:.45s}#content .cards>.card{animation-duration:.5s}.card:hover{transform:none}}
@media(prefers-reduced-motion:reduce){
 body,.layout,.main,.top,#content,#content .cards>.card,#content>.panel,.authbox,.brand .logo,.auth .logo,.pill,.notice:not(.hidden),.chatmsg,.foot,button.primary,.chart .bar{animation:none!important}
 .card,.panel,.nav button,button{transition:none!important}
 .card:hover{transform:none!important}
}

</style></head><body><div id="root"></div>
<script>
const API="";let token=localStorage.getItem("sc_token")||"",page="Overview",summary=null,sales=[],forecasts=[],recommendations=[],suppliers=[],orders=[],alertsData=[],metrics=[],busy=false;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function request(path,opt={}){const h={...(opt.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};const r=await fetch(API+path,{...opt,headers:h});if(!r.ok){let d={};try{d=await r.json()}catch{}throw Error(d.detail||"Request failed: "+r.status)}return r}
let noticeTimer;function notify(msg,error=false){const n=$("#notice");if(!n)return;n.textContent=msg;n.className="notice"+(error?" error":"");n.classList.remove("hidden");clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>n.classList.add("hidden"),9000)}
function authView(){return `<div class="auth"><form class="authbox" id="auth"><div class="logo">SC</div><h1>SupplyChain <span style="color:#70a6ff">AI</span></h1><p>Demand intelligence & inventory optimization</p><label>Email</label><input id="email" type="email" required placeholder="you@company.com"><label>Password</label><input id="password" type="password" minlength="8" required placeholder="At least 8 characters"><button class="primary" id="authbtn">Create account</button><button type="button" class="link" id="toggle">Already registered? Sign in</button><div id="authmsg" class="muted"></div></form></div>`}
function showAuth(){document.body.innerHTML=authView();let mode="register";$("#toggle").onclick=()=>{mode=mode==="register"?"login":"register";$("#authbtn").textContent=mode==="register"?"Create account":"Sign in";$("#toggle").textContent=mode==="register"?"Already registered? Sign in":"Create an account"};$("#auth").onsubmit=async e=>{e.preventDefault();$("#authbtn").disabled=true;try{const r=await fetch(API+"/api/auth/"+mode,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("#email").value,password:$("#password").value})});const d=await r.json();if(!r.ok)throw Error(d.detail||"Authentication failed");token=d.access_token;localStorage.setItem("sc_token",token);location.reload()}catch(x){$("#authmsg").textContent=x.message}finally{$("#authbtn").disabled=false}}}
function shell(){document.body.innerHTML=`<div class="layout"><aside class="side"><div class="brand"><div class="logo">SC</div>SupplyChain AI</div><div class="tag">OPERATIONS INTELLIGENCE</div><nav class="nav">${["Overview","Inventory","Forecasting","Purchase Orders","Alerts","Datasets","Suppliers","AI Assistant"].map((n,i)=>`<button data-page="${n}" class="${page===n?"active":""}">${["▦","▤","⌁","▣","!","⇧","⇄","✧"][i]} &nbsp; ${n}</button>`).join("")}</nav><div class="side-foot">Data-driven supply chain decisions<br><br><button class="ghost" id="logout">↪ Sign out</button></div></aside><main class="main"><header class="top"><div><div class="eyebrow">WORKSPACE / <span id="crumb">${page.toUpperCase()}</span></div><h1 id="heading">${page==="Overview"?"Supply chain overview":page}</h1></div><div class="actions"><button class="ghost" id="refresh">↻ Refresh</button></div></header><div id="notice" class="notice hidden"></div><section id="content"></section><div class="foot">SupplyChain AI · Forecasts are estimates; validate replenishment decisions before purchase</div></main></div>`;document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;document.querySelectorAll("[data-page]").forEach(x=>x.classList.toggle("active",x===b));$("#crumb").textContent=page.toUpperCase();$("#heading").textContent=page==="Overview"?"Supply chain overview":page;render()});$("#logout").onclick=()=>{localStorage.removeItem("sc_token");token="";showAuth()};$("#refresh").onclick=()=>loadAll().then(render).catch(e=>notify(e.message,true));render()}
async function loadAll(){const [a,b,c,d,e,f,g,h]=await Promise.all([request("/api/dashboard/summary"),request("/api/dashboard/sales"),request("/api/forecast/history"),request("/api/inventory/recommendations"),request("/api/suppliers"),request("/api/purchase-orders"),request("/api/alerts"),request("/api/forecast/metrics")]);summary=await a.json();sales=await b.json();forecasts=await c.json();recommendations=await d.json();suppliers=await e.json();orders=await f.json();alertsData=await g.json();metrics=await h.json()}
function table(headers,rows){return `<div class="scroll"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows||""}</tbody></table></div>`}
function status(s){return `<span class="pill ${s==="REORDER"?"bad":s==="OVERSTOCK"?"warn":""}">${esc(s)}</span>`}
function render(){const c=$("#content");if(!c)return;if(page==="Overview"){let all=[...sales.slice(-22).map(x=>({...x,type:"actual"})),...forecasts.slice(0,22).map(x=>({date:x.date,sales:x.predicted_demand,type:"pred"}))];let max=Math.max(1,...all.map(x=>Number(x.sales)||0));c.innerHTML=`<div class="cards">${[["Products",summary?.total_products||0],["Inventory units",summary?.total_inventory||0],["Sales value","₹"+Number(summary?.total_sales||0).toLocaleString("en-IN")],["Forecast demand",summary?.predicted_demand||0],["Low stock",summary?.low_stock_products||0],["Open purchase orders",summary?.pending_purchase_orders||0]].map(x=>`<div class="card"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join("")}</div><section class="panel"><div class="panel-head"><div><h2>Demand intelligence</h2><small class="muted">Daily historical sales and forecast values</small></div><button class="primary" id="train">Generate 30-day forecast</button></div><div class="chart">${all.length?all.map(x=>`<div class="bar ${x.type==="pred"?"pred":""}" title="${esc(x.date)}: ${x.sales}" style="height:${Math.max(3,Number(x.sales)/max*100)}%"></div>`).join(""):'<div class="empty">Upload a dataset to view demand trends</div>'}</div><div class="legend"><span><i class="dot"></i>Actual sales</span><span><i class="dot green"></i>Forecast</span></div></section><section class="panel"><h2>Inventory alerts & recommendations</h2>${recommendationTable(recommendations.slice(0,8))}</section>`;$("#train").onclick=train}
else if(page==="Inventory"){c.innerHTML=`<section class="panel"><div class="panel-head"><h2>Inventory optimization</h2><button class="ghost" id="export">Export CSV</button></div><p class="muted">Reorder point = average daily demand × lead time + safety stock.</p>${recommendationTable(recommendations)}</section>`;$("#export").onclick=()=>download("/api/reports/inventory")}
else if(page==="Forecasting"){c.innerHTML=`<section class="panel"><div class="panel-head"><div><h2>Forecast results</h2><small class="muted">Chronological validation; non-negative daily estimates</small></div><button class="primary" id="train">Train forecasting models</button></div>${table(["Product","Model","MAE","RMSE","WAPE"],metrics.map(m=>`<tr><td>${esc(m.product_id)}</td><td>${esc(m.model)}</td><td>${m.mae}</td><td>${m.rmse}</td><td>${(Number(m.wape)*100).toFixed(1)}%</td></tr>`).join("")||'<tr><td colspan="5" class="empty">Validation metrics appear after model training.</td></tr>')}<h2 style="margin-top:24px">Daily predictions</h2>${table(["Product","Forecast date","Demand","Model"],forecasts.map(f=>`<tr><td>${esc(f.product_id)}</td><td>${esc(f.date)}</td><td>${f.predicted_demand}</td><td>${esc(f.model)}</td></tr>`).join("")||'<tr><td colspan="4" class="empty">No forecasts yet. Upload at least 40 days of sales history and train a model.</td></tr>')}</section>`;$("#train").onclick=train}
else if(page==="Purchase Orders"){c.innerHTML=`<section class="panel"><h2>Create purchase order</h2><form id="po" class="formrow"><select name="product_id" required><option value="">Choose product</option>${recommendations.map(x=>`<option value="${esc(x.product_id)}">${esc(x.name)} (${esc(x.product_id)})</option>`).join("")}</select><input name="quantity" type="number" min="1" required placeholder="Quantity"><select name="supplier_id"><option value="">No supplier assigned</option>${suppliers.map(s=>`<option value="${esc(s.supplier_id)}">${esc(s.name)}</option>`).join("")}</select><button class="primary">Create draft order</button></form><h2 style="margin-top:24px">Order lifecycle</h2>${table(["PO #","Product","Supplier","Qty","Total","Status","Next action"],orders.map(o=>{let next={DRAFT:"SUBMITTED",SUBMITTED:"APPROVED",APPROVED:"RECEIVED"}[o.status];return `<tr><td>#${o.id}</td><td>${esc(o.product_id)}</td><td>${esc(o.supplier_id||"—")}</td><td>${o.quantity}</td><td>₹${Number(o.total_cost).toLocaleString("en-IN")}</td><td>${status(o.status)}</td><td>${next?`<button class="primary" data-order="${o.id}" data-status="${next}">${next}</button><button class="ghost" data-order="${o.id}" data-status="CANCELLED">Cancel</button>`:"—"}</td></tr>`}).join("")||'<tr><td colspan="7" class="empty">No purchase orders yet</td></tr>')}</section>`;$("#po").onsubmit=createPO;document.querySelectorAll("[data-order]").forEach(b=>b.onclick=()=>changePO(b.dataset.order,b.dataset.status))}
else if(page==="Alerts"){c.innerHTML=`<section class="panel"><h2>Inventory alerts</h2><p class="muted">Products requiring attention based on current stock and estimated reorder points.</p>${table(["Product","On hand","Reorder point","Suggested qty","Severity"],alertsData.map(a=>`<tr><td>${esc(a.name)}<br><small class="muted">${esc(a.product_id)}</small></td><td>${a.current_stock}</td><td>${a.reorder_point}</td><td>${a.recommended_order_qty}</td><td>${status(a.status)}</td></tr>`).join("")||'<tr><td colspan="5" class="empty">No inventory alerts. Upload stock and sales data.</td></tr>')}</section>`}
else if(page==="Datasets"){c.innerHTML=`<section class="panel"><h2>Import real public retail transactions</h2><p class="muted">One-click import of the UCI Online Retail dataset: 541,909 real transactions from Dec 2010–Dec 2011. Imports the 20 highest-volume products for a manageable forecasting workspace. Historical sales and prices are source data; inventory and supplier fields are estimates.</p><button class="primary" id="uci-import">Import real UCI dataset</button><div id="uci-result" class="muted" role="status" aria-live="polite" style="margin-top:12px"></div><p class="muted" style="font-size:11px">Source: Chen (2015), UCI Machine Learning Repository · CC BY 4.0 · DOI: 10.24432/C5BW33</p></section><section class="panel"><h2>Upload your own sales data</h2><p class="muted">CSV or XLSX · Required columns: Date, Product_ID (or SKU), Quantity_Sold (or Qty_Sold) · Maximum 100 MB</p><div class="upload">⇧<br><b>Select your CSV or Excel file</b><input type="file" id="file" accept=".csv,.xlsx,.xls"></div><button class="ghost" id="sample">Download generated format example</button><div id="upload-result" class="muted" role="status" aria-live="polite" style="margin-top:12px"></div></section>`;$("#file").onchange=e=>upload(e.target.files[0]);$("#sample").onclick=()=>download("/api/datasets/sample");$("#uci-import").onclick=importUCI}
else if(page==="Suppliers"){c.innerHTML=`<section class="panel"><h2>Add supplier</h2><form id="supplier" class="formrow"><input type="hidden" name="record_id"><input name="supplier_id" placeholder="Supplier ID" required><input name="name" placeholder="Supplier name" required><input name="email" type="email" placeholder="Email"><input name="lead_time" type="number" min="1" max="365" value="7" placeholder="Lead days"><input name="reliability" type="number" min="0" max="1" step=".01" value=".95"><button class="primary">Add supplier</button></form><h2>Supplier directory</h2>${table(["ID","Name","Email","Lead time","Reliability","Action"],suppliers.map(s=>`<tr><td>${esc(s.supplier_id)}</td><td>${esc(s.name)}</td><td>${esc(s.email||"—")}</td><td>${s.lead_time} days</td><td>${s.reliability}</td><td><button class="ghost" data-edit="${s.id}">Edit</button><button class="ghost" data-del="${s.id}">Delete</button></td></tr>`).join("")||'<tr><td colspan="6" class="empty">No suppliers added</td></tr>')}</section>`;$("#supplier").onsubmit=addSupplier;document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editSupplier(b.dataset.edit));document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>deleteSupplier(b.dataset.del))}
else if(page==="AI Assistant"){c.innerHTML=`<section class="panel"><div class="panel-head"><div><h2>Supply chain AI analyst</h2><small class="muted">Grounded in your private dashboard, inventory, suppliers and forecasts</small></div><span id="ai-status" class="pill warn">Checking connection…</span></div><div class="chatlog" id="chatlog"><div class="chatmsg">Hello! Ask me about demand trends, stock risks, reorder quantities, suppliers or forecasts. I use your signed-in workspace data.</div></div><form class="formrow chatbox" id="chat"><input id="question" placeholder="Which products should I reorder this week?" required maxlength="2000"><button class="primary" id="ask-ai">Ask AI</button></form><small class="muted">Chat history is saved to your account database. Never enter passwords, API keys or other secrets here.</small></section>`;$("#chat").onsubmit=chat;loadChatHistory()}
}
function recommendationTable(rows){return table(["Product","On hand","Avg/day","Reorder point","Suggested order","Status"],rows.map(r=>`<tr><td>${esc(r.name)}<br><small class="muted">${esc(r.product_id)}</small></td><td>${r.current_stock}</td><td>${r.avg_daily_demand}</td><td>${r.reorder_point}</td><td>${r.recommended_order_qty}</td><td>${status(r.status)}</td></tr>`).join("")||'<tr><td colspan="6" class="empty">Upload sales history to calculate stock recommendations.</td></tr>')}

async function importUCI(){const b=$("#uci-import"),out=$("#uci-result");if(busy)return;busy=true;b.disabled=true;b.textContent="Importing UCI dataset…";out.textContent="Downloading the original UCI Online Retail workbook, cleaning transactions and saving the top 20 products. Please keep this page open; this may take up to 2 minutes.";try{const r=await request("/api/datasets/uci-online-retail/import",{method:"POST"});const d=await r.json();out.textContent="SUCCESS — "+d.products+" products imported; "+Number(d.rows_imported).toLocaleString()+" daily product records from "+d.date_start+" to "+d.date_end+". "+Number(d.source_transactions_used).toLocaleString()+" source transactions processed. "+d.inventory_note;await loadAll();notify("UCI Online Retail dataset imported successfully. Open Forecasting and train the models.");}catch(e){out.textContent="UCI import failed: "+e.message;notify("UCI import failed: "+e.message,true)}finally{busy=false;b.disabled=false;b.textContent="Import real UCI dataset"}}
async function createPO(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());d.quantity=Number(d.quantity);if(!d.supplier_id)d.supplier_id=null;try{await request("/api/purchase-orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});notify("Draft purchase order created");await loadAll();render()}catch(x){notify(x.message,true)}}
async function changePO(id,statusValue){try{await request("/api/purchase-orders/"+id+"/status",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:statusValue})});notify("Purchase order updated to "+statusValue);await loadAll();render()}catch(x){notify(x.message,true)}}
async function train(){try{notify("Training forecasting models…");const r=await request("/api/forecast/train",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({days:30})});const d=await r.json();notify("Forecast created: "+d.forecast_count+" daily predictions using "+d.selected_model);await loadAll();render()}catch(e){notify(e.message,true)}}
async function upload(file){if(!file)return;const out=$("#upload-result");if(busy)return;const max=100*1024*1024;if(file.size>max){out.textContent="File is larger than 100 MB. Split it into smaller CSV/XLSX files.";notify("Dataset exceeds the 100 MB limit.",true);$("#file").value="";return}busy=true;const input=$("#file");input.disabled=true;out.textContent="Uploading "+file.name+" ("+(file.size/1024/1024).toFixed(2)+" MB)… validating columns and rows. Keep this page open.";try{const fd=new FormData();fd.append("file",file);const r=await request("/api/datasets/upload",{method:"POST",body:fd});const d=await r.json();out.textContent="SUCCESS — "+Number(d.rows_imported).toLocaleString()+" valid rows imported across "+d.products+" products. "+Number(d.removed_or_invalid_rows||0).toLocaleString()+" invalid/duplicate rows skipped.";notify("Dataset imported successfully.");await loadAll();render()}catch(e){out.textContent="Upload failed: "+e.message;notify("Dataset upload failed: "+e.message,true)}finally{busy=false;input.disabled=false;input.value=""}}
async function addSupplier(e){e.preventDefault();const f=new FormData(e.target),d=Object.fromEntries(f.entries()),id=d.record_id;delete d.record_id;d.lead_time=Number(d.lead_time);d.reliability=Number(d.reliability);if(!d.email)d.email=null;try{await request(id?"/api/suppliers/"+id:"/api/suppliers",{method:id?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});notify(id?"Supplier updated":"Supplier added");await loadAll();render()}catch(x){notify(x.message,true)}}
function editSupplier(id){const s=suppliers.find(x=>String(x.id)===String(id));if(!s)return;const f=$("#supplier");f.elements.record_id.value=s.id;f.elements.supplier_id.value=s.supplier_id;f.elements.name.value=s.name;f.elements.email.value=s.email||"";f.elements.lead_time.value=s.lead_time;f.elements.reliability.value=s.reliability;f.scrollIntoView({behavior:"smooth",block:"center"})}
async function deleteSupplier(id){if(!confirm("Delete this supplier?"))return;try{await request("/api/suppliers/"+id,{method:"DELETE"});await loadAll();render();notify("Supplier deleted")}catch(e){notify(e.message,true)}}
async function loadChatHistory(){try{const [s,h]=await Promise.all([request("/api/ai/status"),request("/api/ai/history")]);const status=await s.json(),history=await h.json();const badge=$("#ai-status"),log=$("#chatlog");if(badge){badge.textContent=status.configured?"Groq connected · "+status.model:"Groq API key required";badge.className="pill "+(status.configured?"":"warn")}if(log&&history.length){log.innerHTML=history.map(m=>`<div class="chatmsg ${m.role==="user"?"user":""}">${esc(m.content)}</div>`).join("");log.scrollTop=log.scrollHeight}}catch(e){const badge=$("#ai-status");if(badge){badge.textContent="Connection unavailable";badge.className="pill bad"}}}
async function chat(e){e.preventDefault();const q=$("#question").value.trim(),log=$("#chatlog"),btn=$("#ask-ai");if(!q)return;log.innerHTML+=`<div class="chatmsg user">${esc(q)}</div>`;$("#question").value="";btn.disabled=true;btn.textContent="Thinking…";log.scrollTop=log.scrollHeight;try{const r=await request("/api/ai/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q})});const d=await r.json();log.innerHTML+=`<div class="chatmsg">${esc(d.answer)}</div>`;if(!d.configured){const badge=$("#ai-status");if(badge){badge.textContent="API key required";badge.className="pill warn"}}}catch(x){log.innerHTML+=`<div class="chatmsg">${esc(x.message)}</div>`}finally{btn.disabled=false;btn.textContent="Ask AI";log.scrollTop=log.scrollHeight}}
async function download(path){try{const r=await request(path),blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=path.includes("sample")?"sample_supply_chain.csv":"inventory_recommendations.csv";a.click();URL.revokeObjectURL(url)}catch(e){notify(e.message,true)}}
async function start(){if(!token){showAuth();return}try{await loadAll();shell()}catch(e){localStorage.removeItem("sc_token");token="";showAuth()}}
start();
</script></body></html>
