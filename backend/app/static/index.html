<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a2c"><title>SupplyChain AI — Demand Intelligence</title>
<style>
:root{color-scheme:dark;--bg:#0b1424;--panel:#13223a;--panel2:#182b47;--line:#263b5a;--muted:#91a4bf;--text:#eaf1fb;--blue:#4b8df8;--green:#20c49a;--red:#f07878}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,Segoe UI,Arial}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:#243b5d;color:white;font-weight:650}button.primary{background:var(--blue);color:white}button.ghost{background:transparent;border:1px solid var(--line)}button:disabled{opacity:.55;cursor:wait}.layout{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{background:#0e1c30;border-right:1px solid var(--line);padding:25px 17px;display:flex;flex-direction:column}.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#3676ed,#21c5a0);display:grid;place-items:center;font-weight:900;font-size:18px}.brand{display:flex;gap:12px;align-items:center;font-weight:800;font-size:17px;margin-bottom:4px}.tag{font-size:10px;color:var(--muted);letter-spacing:1.2px;margin:9px 0 30px}.nav{display:grid;gap:7px}.nav button{display:flex;align-items:center;gap:12px;text-align:left;background:transparent;color:#a9bad1}.nav button.active,.nav button:hover{background:#1c3455;color:white}.side-foot{margin-top:auto;color:var(--muted);font-size:12px}.main{padding:30px clamp(18px,4vw,54px);min-width:0;max-width:1600px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}.eyebrow{font-size:10px;color:var(--muted);letter-spacing:1.2px}.top h1{font-size:27px;margin:7px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px;margin-bottom:17px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.card small{color:var(--muted)}.card strong{display:block;font-size:25px;margin-top:13px}.panel{margin-bottom:16px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.panel h2{font-size:16px;margin:0}.muted{color:var(--muted)}.chart{height:225px;display:flex;align-items:end;gap:5px;padding:25px 5px 5px;border-bottom:1px solid var(--line)}.bar{flex:1;min-width:3px;background:linear-gradient(180deg,#4b8df8,#2657a7);border-radius:5px 5px 0 0;position:relative}.bar.pred{background:linear-gradient(180deg,#20c49a,#147d6b)}.legend{display:flex;gap:20px;color:var(--muted);font-size:11px;margin-top:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:6px}.dot.green{background:var(--green)}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:12px}th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.6px}.scroll{overflow:auto}.pill{display:inline-block;padding:5px 8px;border-radius:20px;background:#163e38;color:#53dfb5;font-size:10px;font-weight:800}.pill.warn{background:#49391c;color:#ffd17c}.pill.bad{background:#492b35;color:#ff9ba6}.empty{padding:28px;text-align:center;color:var(--muted)}.upload{border:1px dashed #5075a6;border-radius:12px;padding:25px;text-align:center;margin:18px 0}.upload input{display:block;margin:14px auto 0;max-width:240px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.formrow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.formrow input,.formrow select,.authbox input,.chatbox input{background:#0d192b;border:1px solid var(--line);color:white;padding:11px;border-radius:8px;min-width:0}.formrow input{flex:1}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 15%,#1c3d68,#0b1424 60%)}.authbox{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px}.authbox h1{font-size:25px;margin:15px 0 4px}.authbox p{color:var(--muted);margin:0 0 23px}.authbox label{display:block;margin:13px 0 6px;color:#b9c9dd;font-size:12px}.authbox input{width:100%}.authbox button{width:100%;margin-top:17px}.link{background:none;color:#8fb8ff;padding:12px 0}.notice{margin:0 0 15px;padding:11px 14px;background:#293b55;border-radius:9px;color:#d9e8fc}.notice.error{background:#492b35;color:#ffbdc4}.hidden{display:none!important}.chatlog{min-height:130px;max-height:300px;overflow:auto;background:#0d192b;border:1px solid var(--line);padding:12px;border-radius:9px;margin:12px 0}.chatmsg{padding:9px 11px;background:#1a2c46;border-radius:8px;margin:7px 0;line-height:1.5}.chatmsg.user{background:#1c3a62}.foot{text-align:center;color:#71849e;font-size:11px;padding:24px}@media(max-width:1050px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.layout{display:block}.side{padding:14px;display:block}.brand{display:inline-flex}.tag{display:none}.nav{display:flex;overflow:auto;margin-top:14px}.nav button{white-space:nowrap;padding:10px}.side-foot{display:none}.main{padding:18px}.top{align-items:flex-start}.top h1{font-size:22px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.actions button{padding:8px}.card{padding:14px}.card strong{font-size:20px}}
</style></head><body><div id="root"></div>
<script>
const API="";let token=localStorage.getItem("sc_token")||"",page="Overview",summary=null,sales=[],forecasts=[],recommendations=[],suppliers=[],orders=[],alertsData=[],busy=false;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function request(path,opt={}){const h={...(opt.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};const r=await fetch(API+path,{...opt,headers:h});if(!r.ok){let d={};try{d=await r.json()}catch{}throw Error(d.detail||"Request failed: "+r.status)}return r}
function notify(msg,error=false){const n=$("#notice");if(!n)return;n.textContent=msg;n.className="notice"+(error?" error":"");n.classList.remove("hidden")}
function authView(){return `<div class="auth"><form class="authbox" id="auth"><div class="logo">SC</div><h1>SupplyChain <span style="color:#70a6ff">AI</span></h1><p>Demand intelligence & inventory optimization</p><label>Email</label><input id="email" type="email" required placeholder="you@company.com"><label>Password</label><input id="password" type="password" minlength="8" required placeholder="At least 8 characters"><button class="primary" id="authbtn">Create account</button><button type="button" class="link" id="toggle">Already registered? Sign in</button><div id="authmsg" class="muted"></div></form></div>`}
function showAuth(){document.body.innerHTML=authView();let mode="register";$("#toggle").onclick=()=>{mode=mode==="register"?"login":"register";$("#authbtn").textContent=mode==="register"?"Create account":"Sign in";$("#toggle").textContent=mode==="register"?"Already registered? Sign in":"Create an account"};$("#auth").onsubmit=async e=>{e.preventDefault();$("#authbtn").disabled=true;try{const r=await fetch(API+"/api/auth/"+mode,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("#email").value,password:$("#password").value})});const d=await r.json();if(!r.ok)throw Error(d.detail||"Authentication failed");token=d.access_token;localStorage.setItem("sc_token",token);location.reload()}catch(x){$("#authmsg").textContent=x.message}finally{$("#authbtn").disabled=false}}}
function shell(){document.body.innerHTML=`<div class="layout"><aside class="side"><div class="brand"><div class="logo">SC</div>SupplyChain AI</div><div class="tag">OPERATIONS INTELLIGENCE</div><nav class="nav">${["Overview","Inventory","Forecasting","Purchase Orders","Alerts","Datasets","Suppliers","AI Assistant"].map((n,i)=>`<button data-page="${n}" class="${page===n?"active":""}">${["▦","▤","⌁","▣","!","⇧","⇄","✧"][i]} &nbsp; ${n}</button>`).join("")}</nav><div class="side-foot">Data-driven supply chain decisions<br><br><button class="ghost" id="logout">↪ Sign out</button></div></aside><main class="main"><header class="top"><div><div class="eyebrow">WORKSPACE / <span id="crumb">${page.toUpperCase()}</span></div><h1 id="heading">${page==="Overview"?"Supply chain overview":page}</h1></div><div class="actions"><button class="ghost" id="refresh">↻ Refresh</button></div></header><div id="notice" class="notice hidden"></div><section id="content"></section><div class="foot">SupplyChain AI · Forecasts are estimates; validate replenishment decisions before purchase</div></main></div>`;document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;document.querySelectorAll("[data-page]").forEach(x=>x.classList.toggle("active",x===b));$("#crumb").textContent=page.toUpperCase();$("#heading").textContent=page==="Overview"?"Supply chain overview":page;render()});$("#logout").onclick=()=>{localStorage.removeItem("sc_token");token="";showAuth()};$("#refresh").onclick=()=>loadAll().then(render).catch(e=>notify(e.message,true));render()}
async function loadAll(){const [a,b,c,d,e,f,g]=await Promise.all([request("/api/dashboard/summary"),request("/api/dashboard/sales"),request("/api/forecast/history"),request("/api/inventory/recommendations"),request("/api/suppliers"),request("/api/purchase-orders"),request("/api/alerts")]);summary=await a.json();sales=await b.json();forecasts=await c.json();recommendations=await d.json();suppliers=await e.json();orders=await f.json();alertsData=await g.json()}
function table(headers,rows){return `<div class="scroll"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows||""}</tbody></table></div>`}
function status(s){return `<span class="pill ${s==="REORDER"?"bad":s==="OVERSTOCK"?"warn":""}">${esc(s)}</span>`}
function render(){const c=$("#content");if(!c)return;if(page==="Overview"){let all=[...sales.slice(-22).map(x=>({...x,type:"actual"})),...forecasts.slice(0,22).map(x=>({date:x.date,sales:x.predicted_demand,type:"pred"}))];let max=Math.max(1,...all.map(x=>Number(x.sales)||0));c.innerHTML=`<div class="cards">${[["Products",summary?.total_products||0],["Inventory units",summary?.total_inventory||0],["Sales value","₹"+Number(summary?.total_sales||0).toLocaleString("en-IN")],["Forecast demand",summary?.predicted_demand||0],["Low stock",summary?.low_stock_products||0]].map(x=>`<div class="card"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join("")}</div><section class="panel"><div class="panel-head"><div><h2>Demand intelligence</h2><small class="muted">Daily historical sales and forecast values</small></div><button class="primary" id="train">Generate 30-day forecast</button></div><div class="chart">${all.length?all.map(x=>`<div class="bar ${x.type==="pred"?"pred":""}" title="${esc(x.date)}: ${x.sales}" style="height:${Math.max(3,Number(x.sales)/max*100)}%"></div>`).join(""):'<div class="empty">Upload a dataset to view demand trends</div>'}</div><div class="legend"><span><i class="dot"></i>Actual sales</span><span><i class="dot green"></i>Forecast</span></div></section><section class="panel"><h2>Inventory alerts & recommendations</h2>${recommendationTable(recommendations.slice(0,8))}</section>`;$("#train").onclick=train}
else if(page==="Inventory"){c.innerHTML=`<section class="panel"><div class="panel-head"><h2>Inventory optimization</h2><button class="ghost" id="export">Export CSV</button></div><p class="muted">Reorder point = average daily demand × lead time + safety stock.</p>${recommendationTable(recommendations)}</section>`;$("#export").onclick=()=>download("/api/reports/inventory")}
else if(page==="Forecasting"){c.innerHTML=`<section class="panel"><div class="panel-head"><div><h2>Forecast results</h2><small class="muted">Chronological validation; non-negative daily estimates</small></div><button class="primary" id="train">Train forecasting models</button></div>${table(["Product","Forecast date","Demand","Model"],forecasts.map(f=>`<tr><td>${esc(f.product_id)}</td><td>${esc(f.date)}</td><td>${f.predicted_demand}</td><td>${esc(f.model)}</td></tr>`).join("")||'<tr><td colspan="4" class="empty">No forecasts yet. Upload at least 40 days of sales history and train a model.</td></tr>')}</section>`;$("#train").onclick=train}
else if(page==="Purchase Orders"){c.innerHTML=`<section class="panel"><h2>Create purchase order</h2><form id="po" class="formrow"><select name="product_id" required><option value="">Choose product</option>${recommendations.map(x=>`<option value="${esc(x.product_id)}">${esc(x.name)} (${esc(x.product_id)})</option>`).join("")}</select><input name="quantity" type="number" min="1" required placeholder="Quantity"><select name="supplier_id"><option value="">No supplier assigned</option>${suppliers.map(s=>`<option value="${esc(s.supplier_id)}">${esc(s.name)}</option>`).join("")}</select><button class="primary">Create draft order</button></form><h2 style="margin-top:24px">Order lifecycle</h2>${table(["PO #","Product","Supplier","Qty","Total","Status","Next action"],orders.map(o=>{let next={DRAFT:"SUBMITTED",SUBMITTED:"APPROVED",APPROVED:"RECEIVED"}[o.status];return `<tr><td>#${o.id}</td><td>${esc(o.product_id)}</td><td>${esc(o.supplier_id||"—")}</td><td>${o.quantity}</td><td>₹${Number(o.total_cost).toLocaleString("en-IN")}</td><td>${status(o.status)}</td><td>${next?`<button class="primary" data-order="${o.id}" data-status="${next}">${next}</button><button class="ghost" data-order="${o.id}" data-status="CANCELLED">Cancel</button>`:"—"}</td></tr>`}).join("")||'<tr><td colspan="7" class="empty">No purchase orders yet</td></tr>')}</section>`;$("#po").onsubmit=createPO;document.querySelectorAll("[data-order]").forEach(b=>b.onclick=()=>changePO(b.dataset.order,b.dataset.status))}
else if(page==="Alerts"){c.innerHTML=`<section class="panel"><h2>Inventory alerts</h2><p class="muted">Products requiring attention based on current stock and estimated reorder points.</p>${table(["Product","On hand","Reorder point","Suggested qty","Severity"],alertsData.map(a=>`<tr><td>${esc(a.name)}<br><small class="muted">${esc(a.product_id)}</small></td><td>${a.current_stock}</td><td>${a.reorder_point}</td><td>${a.recommended_order_qty}</td><td>${status(a.status)}</td></tr>`).join("")||'<tr><td colspan="5" class="empty">No inventory alerts. Upload stock and sales data.</td></tr>')}</section>`}
else if(page==="Datasets"){c.innerHTML=`<section class="panel"><h2>Import sales dataset</h2><p class="muted">CSV or XLSX · Required columns: Date, Product_ID, Quantity_Sold · Maximum 15 MB</p><div class="upload">⇧<br><b>Select your CSV or Excel file</b><input type="file" id="file" accept=".csv,.xlsx,.xls"></div><button class="primary" id="sample">Download sample dataset</button><div id="upload-result" class="muted"></div></section>`;$("#file").onchange=e=>upload(e.target.files[0]);$("#sample").onclick=()=>download("/api/datasets/sample")}
else if(page==="Suppliers"){c.innerHTML=`<section class="panel"><h2>Add supplier</h2><form id="supplier" class="formrow"><input name="supplier_id" placeholder="Supplier ID" required><input name="name" placeholder="Supplier name" required><input name="email" type="email" placeholder="Email"><input name="lead_time" type="number" min="1" max="365" value="7" placeholder="Lead days"><input name="reliability" type="number" min="0" max="1" step=".01" value=".95"><button class="primary">Add supplier</button></form><h2>Supplier directory</h2>${table(["ID","Name","Email","Lead time","Reliability","Action"],suppliers.map(s=>`<tr><td>${esc(s.supplier_id)}</td><td>${esc(s.name)}</td><td>${esc(s.email||"—")}</td><td>${s.lead_time} days</td><td>${s.reliability}</td><td><button class="ghost" data-del="${s.id}">Delete</button></td></tr>`).join("")||'<tr><td colspan="6" class="empty">No suppliers added</td></tr>')}</section>`;$("#supplier").onsubmit=addSupplier;document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>deleteSupplier(b.dataset.del))}
else if(page==="AI Assistant"){c.innerHTML=`<section class="panel"><h2>Supply chain AI analyst</h2><p class="muted">Ask about demand, inventory risk, reorder priorities and your uploaded dataset.</p><div class="chatlog" id="chatlog"><div class="chatmsg">Hello! I can analyse your current dashboard and inventory context. Configure an OpenAI API key on the backend to enable natural-language analysis.</div></div><form class="formrow chatbox" id="chat"><input id="question" placeholder="Which products should I reorder this week?" required><button class="primary">Ask AI</button></form></section>`;$("#chat").onsubmit=chat}
}
function recommendationTable(rows){return table(["Product","On hand","Avg/day","Reorder point","Suggested order","Status"],rows.map(r=>`<tr><td>${esc(r.name)}<br><small class="muted">${esc(r.product_id)}</small></td><td>${r.current_stock}</td><td>${r.avg_daily_demand}</td><td>${r.reorder_point}</td><td>${r.recommended_order_qty}</td><td>${status(r.status)}</td></tr>`).join("")||'<tr><td colspan="6" class="empty">Upload sales history to calculate stock recommendations.</td></tr>')}

async function createPO(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());d.quantity=Number(d.quantity);if(!d.supplier_id)d.supplier_id=null;try{await request("/api/purchase-orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});notify("Draft purchase order created");await loadAll();render()}catch(x){notify(x.message,true)}}
async function changePO(id,statusValue){try{await request("/api/purchase-orders/"+id+"/status",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:statusValue})});notify("Purchase order updated to "+statusValue);await loadAll();render()}catch(x){notify(x.message,true)}}
async function train(){try{notify("Training forecasting models…");const r=await request("/api/forecast/train",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({days:30})});const d=await r.json();notify("Forecast created: "+d.forecast_count+" daily predictions using "+d.selected_model);await loadAll();render()}catch(e){notify(e.message,true)}}
async function upload(file){if(!file)return;try{notify("Uploading and validating dataset…");const fd=new FormData();fd.append("file",file);const r=await request("/api/datasets/upload",{method:"POST",body:fd});const d=await r.json();notify("Imported "+d.rows_imported+" rows across "+d.products+" products.");await loadAll();render()}catch(e){notify(e.message,true)}}
async function addSupplier(e){e.preventDefault();const f=new FormData(e.target),d=Object.fromEntries(f.entries());d.lead_time=Number(d.lead_time);d.reliability=Number(d.reliability);try{await request("/api/suppliers",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});notify("Supplier added");await loadAll();render()}catch(x){notify(x.message,true)}}
async function deleteSupplier(id){if(!confirm("Delete this supplier?"))return;try{await request("/api/suppliers/"+id,{method:"DELETE"});await loadAll();render();notify("Supplier deleted")}catch(e){notify(e.message,true)}}
async function chat(e){e.preventDefault();const q=$("#question").value,log=$("#chatlog");log.innerHTML+=`<div class="chatmsg user">${esc(q)}</div>`;$("#question").value="";try{const r=await request("/api/ai/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q})});const d=await r.json();log.innerHTML+=`<div class="chatmsg">${esc(d.answer)}</div>`;if(!d.configured)log.innerHTML+='<div class="muted">Add OPENAI_API_KEY in Render environment variables to activate the AI model.</div>'}catch(x){log.innerHTML+=`<div class="chatmsg">${esc(x.message)}</div>`}}
async function download(path){try{const r=await request(path),blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=path.includes("sample")?"sample_supply_chain.csv":"inventory_recommendations.csv";a.click();URL.revokeObjectURL(url)}catch(e){notify(e.message,true)}}
async function start(){if(!token){showAuth();return}try{await loadAll();shell()}catch(e){localStorage.removeItem("sc_token");token="";showAuth()}}
start();
</script></body></html>
